<!DOCTYPE html>

  <title>E-Blogger - Delete Account</title>
</head>
<body style="font-family: Arial; padding: 20px;">
  <h2>Delete Your Account</h2>

  <p>To delete your account and associated data:</p>

  <ol>
    <li>Open the E-Blogger app</li>
    <li>Go to Profile > Settings</li>
    <li>Select "Delete Account"</li>
  </ol>

  <p>If you are unable to access the app:</p>
  <p>Email: info@eonline.org.in</p>
  <p>Subject: Delete My Account</p>

  <p>Your data will be deleted within 7 days.</p>
</body>
</html>
